
<div class="task-container">
  <div class="add-task">
    <input
      type="text"
      placeholder="Enter a new task"
      [(ngModel)]="newTaskTitle"
      class="task-input"
    />
    <button (click)="addTask()" class="task-button">Add Task</button>
  </div>
  
  <div class="task-list">
    <h2>Todo</h2>
    <div
    cdkDropList
    #todoList="cdkDropList"
    [cdkDropListConnectedTo]="[doneList]"
      [cdkDropListData]="todoTasks"
      class="list"
      (cdkDropListDropped)="onDrop($event)"
    >
      <div class="task-item" *ngFor="let task of todoTasks" cdkDrag>
        {{ task.title }}
        <button class="delete-btn float-right" (click)="onDeleteTask(task.id)">Delete</button>
      </div>
    </div>
  </div>

  <div class="task-list">
    <h2>Done</h2>
    <div
    cdkDropList
    #doneList="cdkDropList"
    [cdkDropListConnectedTo]="[todoList]"
      [cdkDropListData]="doneTasks"
      class="list"
      #doneState
      (cdkDropListDropped)="onDrop($event)"
    >
      <div class="task-item" *ngFor="let task of doneTasks" cdkDrag>
        {{ task.title }}
        <button class="delete-btn float-right" (click)="onDeleteTask(task.id)">Delete</button>
      </div>
    </div>
  </div>
</div>
