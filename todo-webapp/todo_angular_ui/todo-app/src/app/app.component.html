<div class="task-container">
  <div class="add-task">
    <input type="text" placeholder="Enter a new task" [(ngModel)]="newTaskTitle" class="task-input">
    <button (click)="addTask()" class="task-button">Add task</button>
  </div>

  <!-- todo -->

  <div class="task-list">
    <h2>Todo</h2>
    <div
    cdkDropList
    #todoList="cdkDropList"
    [cdkDropListData]="todoTasks"
    [cdkDropListConnectedTo]="[doneList]"
    class="list"
    (cdkDropListDropped)="onDrop($event)">
    <div class="task-item" *ngFor="let item of  todoTasks" cdkDrag>{{item.title}}
      <button class="delete-btn float-right" (click)="onDeleteTask(item.id)">Delete</button>
    </div>
  
  </div>
  </div>


  <!-- done -->

  <div class="task-list">
    <h2>Done</h2>
  <div
    cdkDropList
    #doneList="cdkDropList"
    [cdkDropListData]="doneTasks"
    [cdkDropListConnectedTo]="[todoList]"
    class="list"
    (cdkDropListDropped)="onDrop($event)">
    <div class="task-item" *ngFor="let item of doneTasks" cdkDrag>{{item.title}}
      <button class="delete-btn float-right" (click)="onDeleteTask(item.id)">Delete</button>
    </div>
  </div>
  </div>
</div>
